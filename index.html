<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數位創意創業思維 · 召喚儀式</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cinzel+Decorative:wght@700&family=Noto+Serif+TC:wght@500;700;900&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#120B24;
    --bg-void-2:#1B1240;
    --gold:#C9A227;
    --gold-bright:#F0D68C;
    --arcane:#6D4FE0;
    --arcane-bright:#9C7CFF;
    --parchment:#F4E8D0;
    --parchment-dark:#E4D3AC;
    --ink:#2A1B0F;
    --emerald:#3FA372;
    --text-light:#EDE6FF;
    --text-muted:#a89bd6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, #2c1c5c 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 90%, #1f1450 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-void) 0%, #0c0818 100%);
    color:var(--text-light);
    font-family:'Noto Serif TC','Crimson Text',serif;
    overflow-x:hidden;
    position:relative;
  }

  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{position:absolute;border-radius:50%;background:var(--gold-bright);opacity:.55;animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.8;}}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;z-index:1;
    text-align:center;
    padding:56px 20px 8px;
  }
  .ornament{
    width:180px;height:14px;margin:0 auto 18px;
    background:
      radial-gradient(circle at 50% 50%, var(--gold) 0 3px, transparent 4px),
      linear-gradient(90deg, transparent 0%, var(--gold) 15%, var(--gold) 85%, transparent 100%);
    background-repeat:no-repeat;
    background-size:14px 14px, 100% 1px;
    background-position:center, center;
    opacity:.85;
  }
  .eyebrow{
    font-family:'Cinzel',serif;
    letter-spacing:.35em;
    font-size:12px;
    color:var(--gold);
    text-transform:uppercase;
    margin:0 0 14px;
    margin-right:-0.35em;
  }
  h1.title{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:clamp(32px,6vw,58px);
    margin:0;
    margin-right:-0.04em;
    background:linear-gradient(180deg,var(--gold-bright) 0%, var(--gold) 55%, #a3771c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(201,162,39,.25);
    letter-spacing:.04em;
  }
  .subtitle{
    font-family:'Crimson Text',serif;
    font-style:italic;
    font-size:clamp(13px,2.2vw,17px);
    color:var(--text-muted);
    letter-spacing:.08em;
    margin:10px 0 0;
    margin-right:-0.08em;
  }

  /* ---------- RITUAL STAGE ---------- */
  .ritual-stage{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    padding:36px 16px 20px;
  }

  .circle-wrap{
    position:relative;
    width:min(72vw,420px);
    height:min(72vw,420px);
    display:flex;align-items:center;justify-content:center;
  }

  .magic-circle{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;}
  .ring{transform-origin:210px 210px;}
  .ring.r1{animation:spin 40s linear infinite;}
  .ring.r2{animation:spin 55s linear infinite reverse;}
  .ring.r3{animation:spin 90s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .circle-wrap.active .ring.r1{animation-duration:2.2s;}
  .circle-wrap.active .ring.r2{animation-duration:3s;}
  .circle-wrap.active .ring.r3{animation-duration:1.4s;}

  .rune-line{stroke:var(--arcane-bright);stroke-width:1;fill:none;opacity:.55;}
  .rune-circle{stroke:var(--gold);stroke-width:1.4;fill:none;opacity:.8;}
  .rune-glyph{fill:var(--gold-bright);font-family:'Cinzel',serif;opacity:.85;}
  .star-poly{stroke:var(--arcane-bright);stroke-width:1.1;fill:rgba(109,79,224,.06);}

  .circle-glow{
    position:absolute;width:62%;height:62%;border-radius:50%;
    background:radial-gradient(circle, rgba(156,124,255,.35) 0%, transparent 70%);
    filter:blur(6px);
    transition:opacity .6s ease, transform .6s ease;
    opacity:.5;
  }
  .circle-wrap.active .circle-glow{opacity:1;transform:scale(1.25);}

  .draw-btn{
    position:relative;z-index:2;
    width:128px;height:128px;border-radius:50%;
    border:2px solid var(--gold);
    background:radial-gradient(circle at 35% 30%, #2c1c5c 0%, #180f38 70%);
    color:var(--gold-bright);
    font-family:'Cinzel Decorative','Cinzel',serif;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;
    box-shadow:0 0 24px rgba(201,162,39,.25), inset 0 0 18px rgba(156,124,255,.2);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .draw-btn:hover:not(:disabled){transform:scale(1.05);box-shadow:0 0 34px rgba(201,162,39,.45), inset 0 0 22px rgba(156,124,255,.3);}
  .draw-btn:active:not(:disabled){transform:scale(.97);}
  .draw-btn:disabled{opacity:.4;cursor:not-allowed;}
  .draw-btn .main{font-size:20px;letter-spacing:.12em;}
  .draw-btn .sub{font-size:9px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;font-family:'Cinzel',serif;}
  .draw-btn:focus-visible{outline:2px solid var(--arcane-bright);outline-offset:4px;}

  .status-bar{
    margin-top:26px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;color:var(--text-muted);
  }
  #remainingCount b{color:var(--gold-bright);font-size:14px;}

  .ghost-btn{
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;
    background:transparent;border:1px solid rgba(201,162,39,.5);color:var(--gold);
    padding:8px 16px;border-radius:20px;cursor:pointer;transition:all .2s ease;
    text-transform:uppercase;
  }
  .ghost-btn:hover{background:rgba(201,162,39,.12);}
  .ghost-btn.small{padding:5px 12px;font-size:10px;}
  .ghost-btn:focus-visible{outline:2px solid var(--arcane-bright);outline-offset:2px;}

  /* ---------- HISTORY SCROLL ---------- */
  .history-scroll{
    position:relative;z-index:1;
    max-width:520px;margin:36px auto 60px;padding:0 20px;
  }
  .history-scroll h3{
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.25em;text-transform:uppercase;
    color:var(--gold);text-align:center;margin-bottom:14px;
    display:flex;align-items:center;gap:10px;
  }
  .history-scroll h3::before,.history-scroll h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .history-scroll h3 span{margin-right:-0.25em;}
  #historyList{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  #historyList li{
    background:rgba(244,232,208,.04);
    border:1px solid rgba(201,162,39,.25);
    border-radius:8px;padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;
    animation:fadeIn .5s ease;
  }
  #historyList li .idx{color:var(--gold);font-family:'Cinzel',serif;font-size:11px;margin-right:10px;}
  #historyList .empty{border:none;background:none;color:var(--text-muted);font-style:italic;justify-content:center;font-size:13px;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- REVEAL OVERLAY ---------- */
  .reveal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(8,5,18,.82);
    backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .35s ease;
    padding:20px;
  }
  .reveal-overlay.show{opacity:1;pointer-events:auto;}

  .parchment{
    position:relative;
    width:min(90vw,420px);
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    color:var(--ink);
    border-radius:6px;
    padding:44px 30px 34px;
    text-align:center;
    box-shadow:0 0 0 1px rgba(201,162,39,.6), 0 20px 60px rgba(0,0,0,.5), 0 0 60px rgba(156,124,255,.25);
    transform:scale(.85) translateY(20px);
    transition:transform .4s cubic-bezier(.2,.9,.3,1.2);
  }
  .reveal-overlay.show .parchment{transform:scale(1) translateY(0);}
  .parchment::before{
    content:"";position:absolute;inset:10px;
    border:1px solid rgba(42,27,15,.35);border-radius:3px;
    pointer-events:none;
  }
  .seal{
    width:44px;height:44px;margin:0 auto 14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--arcane-bright), var(--arcane) 60%, #3c2a8f 100%);
    box-shadow:0 0 18px rgba(109,79,224,.6);
  }
  .reveal-label{
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:#6b4f22;margin:0 0 10px;
  }
  #revealName{
    font-family:'Noto Serif TC',serif;font-weight:900;
    font-size:clamp(28px,7vw,40px);
    margin:0 0 26px;
    min-height:1.3em;
  }
  #revealName .ltr{opacity:0;display:inline-block;animation:inkIn .35s ease forwards;}
  @keyframes inkIn{from{opacity:0;transform:translateY(6px) scale(.9);filter:blur(2px);}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}

  #closeReveal{
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    background:var(--ink);color:var(--parchment);border:none;
    padding:10px 26px;border-radius:20px;cursor:pointer;
  }
  #closeReveal:hover{background:#402c17;}

  /* ---------- ADMIN ---------- */
  .admin-toggle{
    position:fixed;bottom:22px;right:22px;z-index:40;
    width:52px;height:52px;border-radius:50%;
    border:1px solid var(--gold);
    background:radial-gradient(circle at 35% 30%, #2c1c5c, #180f38 70%);
    color:var(--gold-bright);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 18px rgba(201,162,39,.25);
  }
  .admin-toggle:hover{box-shadow:0 0 26px rgba(201,162,39,.45);}
  .admin-toggle:focus-visible{outline:2px solid var(--arcane-bright);outline-offset:3px;}

  .admin-drawer{
    position:fixed;top:0;right:0;height:100%;
    width:min(90vw,380px);
    background:linear-gradient(180deg,#180f38 0%, #100a2a 100%);
    border-left:1px solid rgba(201,162,39,.35);
    z-index:60;
    transform:translateX(100%);
    transition:transform .35s ease;
    display:flex;flex-direction:column;
  }
  .admin-drawer.open{transform:translateX(0);}
  .admin-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 22px;border-bottom:1px solid rgba(201,162,39,.25);
  }
  .admin-header h3{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.15em;color:var(--gold);margin:0;text-transform:uppercase;}
  #closeAdmin{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;}
  #closeAdmin:hover{color:var(--gold-bright);}

  .admin-body{padding:20px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;}
  .admin-body label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;}
  #bulkInput{
    width:100%;min-height:100px;resize:vertical;
    background:rgba(244,232,208,.05);
    border:1px solid rgba(201,162,39,.35);border-radius:6px;
    color:var(--text-light);font-family:'Crimson Text',serif;font-size:15px;
    padding:10px 12px;
  }
  #bulkInput:focus-visible,input:focus-visible{outline:2px solid var(--arcane-bright);}
  #addBulk{
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--gold);color:var(--ink);border:none;border-radius:6px;
    padding:10px;cursor:pointer;font-weight:600;
  }
  #addBulk:hover{background:var(--gold-bright);}

  .admin-list-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:6px;font-size:13px;color:var(--text-muted);
    font-family:'Cinzel',serif;letter-spacing:.05em;
  }
  #rosterCount{color:var(--gold-bright);}

  #rosterList{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
  #rosterList li{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(244,232,208,.04);border:1px solid rgba(201,162,39,.15);
    border-radius:6px;padding:8px 12px;font-size:14px;
  }
  #rosterList li.is-drawn{opacity:.4;text-decoration:line-through;}
  #rosterList li button{
    background:none;border:none;color:#c97757;cursor:pointer;font-size:15px;line-height:1;
  }
  #rosterList li button:hover{color:#e89178;}
  #rosterList .empty{justify-content:center;font-style:italic;color:var(--text-muted);border:none;background:none;}

  /* ---------- ADMIN GATE (password) ---------- */
  .admin-gate{
    position:fixed;inset:0;z-index:70;
    background:rgba(8,5,18,.82);
    backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    padding:20px;
  }
  .admin-gate.show{opacity:1;pointer-events:auto;}
  .gate-card{
    width:min(90vw,320px);
    background:linear-gradient(180deg,#231457 0%, #150c34 100%);
    border:1px solid rgba(201,162,39,.5);
    border-radius:10px;
    padding:30px 26px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(156,124,255,.2);
    transform:scale(.9);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .admin-gate.show .gate-card{transform:scale(1);}
  .gate-card.shake{animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .gate-label{
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);margin:0 0 16px;
  }
  #gatePassword{
    width:100%;background:rgba(244,232,208,.06);
    border:1px solid rgba(201,162,39,.4);border-radius:6px;
    color:var(--text-light);font-size:16px;letter-spacing:.15em;
    padding:10px 14px;text-align:center;margin-bottom:14px;
  }
  #gatePassword:focus-visible{outline:2px solid var(--arcane-bright);}
  .gate-actions{display:flex;gap:10px;justify-content:center;}
  #gateSubmit{
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--gold);color:var(--ink);border:none;border-radius:20px;
    padding:9px 22px;cursor:pointer;font-weight:600;
  }
  #gateSubmit:hover{background:var(--gold-bright);}
  .gate-error{color:#e89178;font-size:12px;margin:12px 0 0;font-family:'Cinzel',serif;letter-spacing:.05em;}

  @media (prefers-reduced-motion: reduce){
    .ring,.star{animation:none !important;}
  }

  @media (max-width:520px){
    .status-bar{flex-direction:column;gap:10px;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<header class="hero">
  <div class="ornament"></div>
  <p class="eyebrow">抽籤儀式<br>The Draw</p>
  <h1 class="title">數位創意創業思維</h1>
  <p class="subtitle">Digital Creativity and Entrepreneurship</p>
</header>

<main class="ritual-stage">
  <div class="circle-wrap" id="circleWrap">
    <div class="circle-glow"></div>
    <svg class="magic-circle" viewBox="0 0 420 420">
      <g class="ring r3" transform-origin="210 210">
        <polygon class="star-poly" points="210,65 295.2,327.3 72.1,165.2 347.9,165.2 124.8,327.3"/>
      </g>
      <g class="ring r2" transform-origin="210 210">
        <circle class="rune-circle" cx="210" cy="210" r="150"/>
        <circle class="rune-line" cx="210" cy="210" r="132"/>
      </g>
      <g class="ring r1" transform-origin="210 210">
        <circle class="rune-circle" cx="210" cy="210" r="184"/>
        <path id="runePath" d="M 210,26 A 184,184 0 1 1 209.9,26" fill="none"/>
        <text class="rune-glyph" font-size="16" letter-spacing="20">
          <textPath href="#runePath" startOffset="0%">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ</textPath>
        </text>
      </g>
    </svg>
    <button class="draw-btn" id="drawBtn">
      <span class="main">召喚</span>
      <span class="sub">Draw</span>
    </button>
  </div>

  <div class="status-bar">
    <span id="remainingCount">名冊尚未建立</span>
    <button class="ghost-btn" id="resetBtn">重置本輪</button>
  </div>
</main>

<div class="history-scroll">
  <h3><span>已召喚名單</span></h3>
  <ol id="historyList"><li class="empty">尚無召喚紀錄</li></ol>
</div>

<div class="reveal-overlay" id="revealOverlay">
  <div class="parchment">
    <div class="seal"></div>
    <p class="reveal-label">命運選中了</p>
    <h2 id="revealName"></h2>
    <button id="closeReveal">闔上卷軸</button>
  </div>
</div>

<button class="admin-toggle" id="adminToggle" title="管理學員名冊" aria-label="管理學員名冊">📜</button>

<div class="admin-drawer" id="adminDrawer">
  <div class="admin-header">
    <h3>學員名冊管理</h3>
    <button id="closeAdmin" aria-label="關閉">✕</button>
  </div>
  <div class="admin-body">
    <label for="bulkInput">貼上名單（一行一位）</label>
    <textarea id="bulkInput" placeholder="王小明&#10;陳雅婷&#10;林俊傑"></textarea>
    <button id="addBulk">加入名冊</button>

    <div class="admin-list-header">
      <span>目前名冊（<span id="rosterCount">0</span> 位）</span>
      <button class="ghost-btn small" id="clearAll">清空全部</button>
    </div>
    <ul id="rosterList"><li class="empty">名冊是空的</li></ul>
  </div>
</div>

<div class="admin-gate" id="adminGate">
  <div class="gate-card" id="gateCard">
    <p class="gate-label">請輸入通行咒語</p>
    <input type="password" id="gatePassword" placeholder="•••••••" autocomplete="off">
    <div class="gate-actions">
      <button id="gateSubmit">解鎖名冊</button>
      <button id="gateCancel" class="ghost-btn small">取消</button>
    </div>
    <p class="gate-error" id="gateError" hidden>咒語不正確，請再試一次</p>
  </div>
</div>

<script>
(function(){
  // 老師專屬密碼：發布前請務必修改成自己的密語
  const ADMIN_PASSWORD = "TNDA2026";
  // ---------- starfield ----------
  const starsEl = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2.4+0.6;
    s.style.width=size+'px';
    s.style.height=size+'px';
    s.style.top=Math.random()*100+'%';
    s.style.left=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*4)+'s';
    starsEl.appendChild(s);
  }

  // ---------- state ----------
  let roster = [];   // {id, name, drawn}
  let history = [];  // names in draw order

  const rosterListEl = document.getElementById('rosterList');
  const rosterCountEl = document.getElementById('rosterCount');
  const remainingCountEl = document.getElementById('remainingCount');
  const historyListEl = document.getElementById('historyList');
  const drawBtn = document.getElementById('drawBtn');
  const circleWrap = document.getElementById('circleWrap');
  const revealOverlay = document.getElementById('revealOverlay');
  const revealNameEl = document.getElementById('revealName');

  function loadState(){
    try{
      const r = localStorage.getItem('draw_roster_v1');
      roster = r ? JSON.parse(r) : [];
    }catch(e){ roster = []; }
    try{
      const h = localStorage.getItem('draw_history_v1');
      history = h ? JSON.parse(h) : [];
    }catch(e){ history = []; }
    render();
  }

  function saveRoster(){
    try{ localStorage.setItem('draw_roster_v1', JSON.stringify(roster)); }catch(e){}
  }
  function saveHistory(){
    try{ localStorage.setItem('draw_history_v1', JSON.stringify(history)); }catch(e){}
  }

  function render(){
    // roster list in admin
    if(roster.length===0){
      rosterListEl.innerHTML = '<li class="empty">名冊是空的</li>';
    }else{
      rosterListEl.innerHTML = roster.map(s=>
        `<li class="${s.drawn?'is-drawn':''}" data-id="${s.id}">
          <span>${escapeHtml(s.name)}</span>
          <button data-remove="${s.id}" aria-label="移除 ${escapeHtml(s.name)}">✕</button>
        </li>`
      ).join('');
    }
    rosterCountEl.textContent = roster.length;

    const remaining = roster.filter(s=>!s.drawn).length;
    if(roster.length===0){
      remainingCountEl.textContent = '名冊尚未建立';
    }else{
      remainingCountEl.innerHTML = `尚有 <b>${remaining}</b> / ${roster.length} 位學員未被召喚`;
    }
    drawBtn.disabled = remaining===0;

    // history
    if(history.length===0){
      historyListEl.innerHTML = '<li class="empty">尚無召喚紀錄</li>';
    }else{
      historyListEl.innerHTML = history.map((name,i)=>
        `<li><span><span class="idx">No.${String(i+1).padStart(2,'0')}</span>${escapeHtml(name)}</span></li>`
      ).join('');
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- admin interactions ----------
  const adminToggle = document.getElementById('adminToggle');
  const adminDrawer = document.getElementById('adminDrawer');
  const adminGate = document.getElementById('adminGate');
  const gateCard = document.getElementById('gateCard');
  const gatePassword = document.getElementById('gatePassword');
  const gateError = document.getElementById('gateError');

  function isUnlocked(){
    return sessionStorage.getItem('draw_admin_unlocked') === '1';
  }

  document.getElementById('closeAdmin').addEventListener('click', ()=>adminDrawer.classList.remove('open'));

  adminToggle.addEventListener('click', ()=>{
    if(isUnlocked()){
      adminDrawer.classList.toggle('open');
    }else{
      gatePassword.value='';
      gateError.hidden = true;
      adminGate.classList.add('show');
      setTimeout(()=>gatePassword.focus(), 200);
    }
  });

  function tryUnlock(){
    if(gatePassword.value === ADMIN_PASSWORD){
      sessionStorage.setItem('draw_admin_unlocked','1');
      adminGate.classList.remove('show');
      adminDrawer.classList.add('open');
    }else{
      gateError.hidden = false;
      gateCard.classList.remove('shake');
      void gateCard.offsetWidth; // restart animation
      gateCard.classList.add('shake');
    }
  }

  document.getElementById('gateSubmit').addEventListener('click', tryUnlock);
  gatePassword.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });
  document.getElementById('gateCancel').addEventListener('click', ()=>adminGate.classList.remove('show'));
  adminGate.addEventListener('click', (e)=>{ if(e.target===adminGate) adminGate.classList.remove('show'); });

  document.getElementById('addBulk').addEventListener('click', async ()=>{
    const ta = document.getElementById('bulkInput');
    const names = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(names.length===0) return;
    let base = Date.now();
    names.forEach((name,i)=>{
      roster.push({ id: base+i, name, drawn:false });
    });
    ta.value='';
    await saveRoster();
    render();
  });

  rosterListEl.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button[data-remove]');
    if(!btn) return;
    const id = Number(btn.getAttribute('data-remove'));
    roster = roster.filter(s=>s.id!==id);
    await saveRoster();
    render();
  });

  document.getElementById('clearAll').addEventListener('click', async ()=>{
    if(roster.length===0) return;
    if(!confirm('確定要清空整份名冊嗎？此動作無法復原。')) return;
    roster = [];
    history = [];
    await saveRoster();
    await saveHistory();
    render();
  });

  // ---------- reset (draw pool only, keeps roster) ----------
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(roster.length===0) return;
    roster.forEach(s=>s.drawn=false);
    history = [];
    await saveRoster();
    await saveHistory();
    render();
  });

  // ---------- draw ritual ----------
  let drawing = false;
  drawBtn.addEventListener('click', async ()=>{
    if(drawing) return;
    const pool = roster.filter(s=>!s.drawn);
    if(pool.length===0) return;

    drawing = true;
    drawBtn.disabled = true;
    circleWrap.classList.add('active');

    const chosen = pool[Math.floor(Math.random()*pool.length)];

    setTimeout(async ()=>{
      chosen.drawn = true;
      history.unshift(chosen.name);
      await saveRoster();
      await saveHistory();
      render();
      circleWrap.classList.remove('active');
      showReveal(chosen.name);
      drawing = false;
    }, 1600);
  });

  function showReveal(name){
    revealNameEl.innerHTML = name.split('').map((ch,i)=>
      `<span class="ltr" style="animation-delay:${i*0.06}s">${escapeHtml(ch)}</span>`
    ).join('');
    revealOverlay.classList.add('show');
  }
  document.getElementById('closeReveal').addEventListener('click', ()=>{
    revealOverlay.classList.remove('show');
    render();
  });
  revealOverlay.addEventListener('click', (e)=>{
    if(e.target===revealOverlay){
      revealOverlay.classList.remove('show');
      render();
    }
  });

  loadState();
})();
</script>

</body>
</html>
